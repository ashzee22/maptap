name: Daily Scores & AI Update

on:
  schedule:
    # 14:00 UTC = 10:00 AM EDT
    # 20:00 UTC = 4:00 PM EDT
    - cron: '0 14,20 * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      - name: Run Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_scores

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily update via Gemini" && git push)
