name: Update MapTap Scores

# Runs every hour on the hour, then the first step below checks whether
# it's actually 1am or 1pm in the Eastern timezone before doing anything
# else. This is deliberate instead of a plain "0 5,17 * * *" cron: GitHub
# Actions cron is always UTC and doesn't shift for daylight saving, so a
# fixed UTC cron would drift an hour off "1am/1pm local" twice a year.
# Checking the local hour at runtime sidesteps that entirely.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write   # needed to git push the updated HTML back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check if it's 1am or 1pm Eastern right now
        id: timecheck
        run: |
          HOUR=$(TZ="America/New_York" date +%H)
          if [ "$HOUR" = "01" ] || [ "$HOUR" = "13" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install requests

      - name: Pull latest scores and update site
        if: steps.timecheck.outputs.run == 'true'
        run: python scripts/update_scores.py

      - name: Commit and push if anything changed
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "maptap-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update MapTap scores"
          git push
